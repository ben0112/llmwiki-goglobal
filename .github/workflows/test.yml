name: Tests

on:
  push:
    branches: [master, "claude/**", "feat/**"]
  pull_request:
    branches: [master, "claude/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared core
        run: pip install -e . --no-deps

      - name: Install all dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r mcp/requirements.txt
          pip install -r tests/requirements.txt cryptography

      - name: Run shared core unit tests
        run: pytest tests/unit/core/ -v

      - name: Run API unit tests
        run: PYTHONPATH=api pytest tests/unit/test_chunker.py tests/unit/test_helpers.py tests/unit/test_pdf_extract.py tests/unit/test_highlight_granular.py tests/unit/test_html_parser_highlights.py tests/unit/test_s3_selfhost.py tests/unit/test_sqlite_document_repo.py tests/unit/test_wiki_regen.py tests/unit/test_archive_extract.py tests/unit/test_tus_sanitize_and_tasks.py tests/unit/test_tus_sessions.py tests/unit/test_hosted_tus_multipart.py tests/unit/test_hosted_quota.py tests/unit/test_health_roles.py tests/unit/test_ws_listener.py tests/unit/test_url_ingest.py tests/unit/test_facet_rollup.py tests/unit/test_graph_local.py tests/unit/test_resumable_upload.py tests/unit/test_workspace_sweep.py tests/unit/test_extraction_fixes.py tests/unit/test_local_document_invariants.py tests/unit/test_local_reconcile.py tests/unit/jobs/ -v

      - name: Run durable scaling static tests
        run: PYTHONPATH=api pytest tests/integration/test_scaled_compose.py -v

      - name: Run MCP unit tests
        working-directory: mcp
        run: pytest ../tests/unit/mcp/ -v

      - name: Run corpus classification tests
        run: pytest tests/unit/corpus/ -v

  mcp-integration:
    name: MCP integration tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared core
        run: pip install -e . --no-deps

      - name: Install MCP dependencies
        run: pip install -r mcp/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt cryptography

      - name: Run MCP VaultFS + tool handler tests
        working-directory: mcp
        run: pytest ../tests/integration/mcp/test_vaultfs_contract.py ../tests/integration/mcp/test_tool_handlers.py ../tests/integration/mcp/test_corpus_facets.py ../tests/integration/mcp/test_corpus_relations.py ../tests/integration/mcp/test_corpus_fold.py ../tests/integration/mcp/test_wiki_write_invariants.py::test_sqlite_atomic_wiki_write ../tests/integration/mcp/test_wiki_write_invariants.py::test_sqlite_startup_reconciles_disk_after_database_rollback -v

  s3-integration:
    name: Integration tests (MinIO)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start MinIO
        run: |
          docker run --detach --name llmwiki-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=test-access \
            --env MINIO_ROOT_PASSWORD=test-secret-key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 40 ]; then
              docker logs llmwiki-minio
              exit 1
            fi
            sleep 0.25
          done

      - name: Run multipart object-store tests
        env:
          S3_MULTIPART_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_MULTIPART_TEST_ACCESS_KEY: test-access
          S3_MULTIPART_TEST_SECRET_KEY: test-secret-key
          S3_MULTIPART_TEST_BUCKET: llmwiki-multipart-test
        run: PYTHONPATH=api pytest tests/integration/test_s3_multipart.py -v

  redis-integration:
    name: Integration tests (Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run Redis TUS coordination tests
        env:
          TUS_REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: PYTHONPATH=api pytest tests/integration/test_tus_sessions_redis.py -v

  postgres-integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_DB: supavault_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared core
        run: pip install -e . --no-deps

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install MCP dependencies
        run: pip install -r mcp/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt cryptography

      - name: Run API isolation + lifecycle tests
        run: PYTHONPATH=api MODE=hosted pytest tests/integration/test_derived_recovery.py tests/integration/test_durable_extraction.py tests/integration/test_durable_graph_rebuild.py tests/integration/isolation/ tests/integration/test_kb_lifecycle.py tests/integration/test_note_lifecycle.py tests/integration/test_document_invariants.py tests/integration/test_converter_isolation.py -v

      - name: Run durable job ledger and delivery tests
        run: PYTHONPATH=api MODE=hosted pytest tests/integration/test_background_job_schema.py tests/integration/test_background_job_repository.py tests/integration/test_job_delivery.py -v

      - name: Run Hosted quota coordination tests
        env:
          QUOTA_REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: PYTHONPATH=api MODE=hosted pytest tests/integration/test_hosted_quota.py -v

      - name: Start fixed-version MinIO for Hosted TUS
        run: |
          docker run --detach --name llmwiki-tus-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=test-access \
            --env MINIO_ROOT_PASSWORD=test-secret-key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 40 ]; then
              docker logs llmwiki-tus-minio
              exit 1
            fi
            sleep 0.25
          done

      - name: Run cross-replica Hosted TUS tests
        env:
          TUS_MULTIPART_REDIS_URL: redis://127.0.0.1:6379/0
          TUS_MULTIPART_S3_ENDPOINT: http://127.0.0.1:9000
          TUS_MULTIPART_S3_ACCESS_KEY: test-access
          TUS_MULTIPART_S3_SECRET_KEY: test-secret-key
          TUS_MULTIPART_S3_BUCKET: llmwiki-tus-test
        run: PYTHONPATH=api MODE=hosted pytest tests/integration/test_tus_multipart.py -v

      - name: Run API-key auth + hosted corpus import tests
        run: PYTHONPATH=api MODE=hosted pytest tests/integration/test_api_key_auth.py tests/integration/test_corpus_hosted_import.py tests/integration/test_corpus_hosted_pipeline.py -v

      - name: Run MCP Postgres isolation tests
        working-directory: mcp
        run: |
          pytest ../tests/integration/mcp/test_mcp_isolation.py -v
          pytest ../tests/integration/mcp/test_wiki_write_postgres.py -v
