# 局域网一键自部署(多用户托管模式,无域名/无 TLS)。
#
# 与 docker-compose.selfhost.yml 的关系:selfhost 版假设你已有公网域名、
# 反向代理与完整 Supabase 栈;本文件把最小依赖(supabase/postgres +
# GoTrue + 路由)也一并拉起,适合内网 IP 直连的部署(如 192.168.x.x)。
#
# 用法(在目标机、仓库根目录):
#   bash deploy/lan/bootstrap.sh <本机局域网IP>
# bootstrap 会生成 deploy/lan/.env.lan(全部密钥,含 ES256 JWT 签名密钥)
# 后执行本 compose。手工运行:
#   docker compose -f deploy/lan/docker-compose.lan.yml --env-file deploy/lan/.env.lan up -d --build
#
# 端口(宿主机):Web 3000 · API 8000 · MCP 8080 · Auth 8001 ·
#   MinIO S3 9000(浏览器直传需可达)· MinIO 控制台 9001 · Postgres 仅本机 5432
#
# 扩缩容:api 只跑一个副本(断点上传状态/WebSocket/图谱锁为进程内状态)。

name: llmwiki-lan

services:
  db:
    image: supabase/postgres:15.14.1.162
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 仅宿主机本机:psql 运维 / 语料导入 CLI
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # GoTrue(邮箱密码认证)。以 ES256 非对称密钥签发 JWT,并在
  # /.well-known/jwks.json 公开公钥 —— api 服务用 JWKS 校验用户令牌。
  auth:
    image: supabase/auth:v2.195.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}
      GOTRUE_JWT_ISSUER: ${SUPABASE_URL}/auth/v1
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"   # 内网无邮件服务:注册即生效
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Kong 的极简替身:把 supabase-js 约定的 /auth/v1/* 前缀路由到 GoTrue。
  auth-router:
    image: nginx:1.27-alpine
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./auth-router.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    restart: unless-stopped

  # 幂等数据库初始化:等 GoTrue 建好 auth 架构后应用本仓库迁移 001..010,
  # 已应用的记录在 app_migrations 账本里跳过。
  db-init:
    image: supabase/postgres:15.14.1.162
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ../../supabase/migrations:/migrations:ro
      - ./db-init.sh:/db-init.sh:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["bash", "/db-init.sh"]
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API:浏览器直传预签名 URL,需局域网可达
      - "9001:9001"   # 管理控制台
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc admin user add local $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY} || true &&
      mc admin policy attach local readwrite --user $${AWS_ACCESS_KEY_ID} || true
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

  api:
    build:
      context: ../../api
    environment:
      MODE: hosted
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_FORCE_PATH_STYLE: "true"
      CONVERTER_URL: http://converter:8000
      CONVERTER_SECRET: ${CONVERTER_SECRET}
      PDF_BACKEND: opendataloader
      GLOBAL_MAX_USERS: ${GLOBAL_MAX_USERS:-10000}
      STAGE: prod
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      auth-router:
        condition: service_started
    restart: unless-stopped

  mcp:
    build:
      context: ../../mcp
    environment:
      MODE: hosted
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      MCP_URL: ${MCP_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_FORCE_PATH_STYLE: "true"
      STAGE: prod
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  converter:
    build:
      context: ../../converter
    environment:
      CONVERTER_SECRET: ${CONVERTER_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: us-east-1
      S3_ENDPOINT: ${S3_ENDPOINT_URL}
      PORT: "8000"
    # 仅供 api 内网调用,不映射宿主机端口
    restart: unless-stopped

  web:
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_MODE: hosted
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_MCP_URL: ${MCP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
