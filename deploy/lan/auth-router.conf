# Kong 的极简替身:supabase-js 与 api 都按 Supabase 网关约定访问
# ${SUPABASE_URL}/auth/v1/*;这里把该前缀剥掉后转发给 GoTrue(:9999)。
# CORS 由 GoTrue 自己处理(它返回 Access-Control-Allow-* 头),无需在此叠加。
server {
    listen 80;
    server_name _;

    # 反代 GoTrue:proxy_pass 结尾带 / => 剥掉 /auth/v1 前缀
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 容器/脚本健康检查
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
