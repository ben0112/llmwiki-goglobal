# Self-hosted deployment of the four application services + MinIO.
#
# Prerequisites (see docs/self-hosting.md):
#   1. A self-hosted Supabase stack (Postgres + GoTrue auth behind Kong) —
#      run it from Supabase's official docker compose; it is NOT part of
#      this file. Apply supabase/migrations/ 001..012 to its database.
#   2. Copy deploy/.env.selfhost.example to deploy/.env.selfhost and fill it in.
#
# Build + run from the repository root:
#   docker compose -f deploy/docker-compose.selfhost.yml --env-file deploy/.env.selfhost up -d --build
#
# API and worker replicas scale independently. Gateway is the only public API
# listener and resolves the current API task set through Docker DNS.

name: llmwiki-selfhost

services:
  ci-postgres:
    profiles: ["ci"]
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${CI_POSTGRES_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  ci-auth:
    profiles: ["ci"]
    image: python:3.11-alpine
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /jwks/auth/v1/.well-known &&
        echo "$${CI_JWKS_B64}" | base64 -d > /jwks/auth/v1/.well-known/jwks.json &&
        python -m http.server 8000 --directory /jwks
    environment:
      CI_JWKS_B64: ${CI_JWKS_B64}

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API — must also be reachable by browsers (presigned URLs)
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc admin user add local $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY} || true &&
      mc admin policy attach local readwrite --user $${AWS_ACCESS_KEY_ID} || true
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      MODE: hosted
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_FORCE_PATH_STYLE: "true"
      CONVERTER_URL: http://converter:8000
      CONVERTER_SECRET: ${CONVERTER_SECRET}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PDF_BACKEND: ${PDF_BACKEND:-opendataloader}
      GLOBAL_MAX_USERS: ${GLOBAL_MAX_USERS:-10000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      REDIS_URL: redis://redis:6379/0
      DURABLE_JOBS_ENABLED: ${DURABLE_JOBS_ENABLED:-true}
      TUS_MULTIPART_ENABLED: ${TUS_MULTIPART_ENABLED:-true}
      STAGE: ${STAGE:-prod}
      LLMWIKI_REPLICA_ROLE: api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      converter:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["arq", "jobs.worker.WorkerSettings"]
    environment:
      MODE: hosted
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_FORCE_PATH_STYLE: "true"
      CONVERTER_URL: http://converter:8000
      CONVERTER_SECRET: ${CONVERTER_SECRET}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PDF_BACKEND: ${PDF_BACKEND:-opendataloader}
      REDIS_URL: redis://redis:6379/0
      DURABLE_JOBS_ENABLED: ${DURABLE_JOBS_ENABLED:-true}
      TUS_MULTIPART_ENABLED: ${TUS_MULTIPART_ENABLED:-true}
      STAGE: ${STAGE:-prod}
      LLMWIKI_REPLICA_ROLE: worker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      converter:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    environment:
      MODE: hosted
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      MCP_URL: ${MCP_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_FORCE_PATH_STYLE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      STAGE: prod
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  converter:
    build:
      context: ../converter
    environment:
      CONVERTER_SECRET: ${CONVERTER_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT_URL}
      PORT: "8000"
    # Internal-only: no host port. Only the api service calls it.
    restart: unless-stopped

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_MODE: hosted
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_MCP_URL: ${MCP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  minio-data:
  redis-data:
